<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d3b2e">
<title>ایمنی در آزمایشگاه‌های نفت</title>
<style>
:root{
  --bg:#f5faf7;--card:#ffffff;--card2:#e8f5ee;
  --primary:#0d3b2e;--accent:#2ecc71;--accent2:#16a34a;
  --text:#1a202c;--muted:#64748b;--border:#d1e7dd;
  --shadow:0 4px 20px rgba(13,59,46,.08);
  --nav-bg:#0d3b2e;--nav-text:#e8f5ee;
  --font-size:16px;
}
html.dark{
  --bg:#0a1f17;--card:#132b22;--card2:#1c3a2e;
  --primary:#e8f5ee;--accent:#2ecc71;--accent2:#16a34a;
  --text:#e0e1dd;--muted:#8d99ae;--border:#2a4a3d;
  --shadow:0 4px 20px rgba(0,0,0,.4);
  --nav-bg:#061410;--nav-text:#e8f5ee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{
  font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);
  font-size:var(--font-size);line-height:1.9;transition:background .3s,color .3s;
  min-height:100vh;
}
.topbar{
  position:fixed;top:0;left:0;right:0;height:56px;
  background:var(--nav-bg);color:var(--nav-text);
  display:flex;align-items:center;padding:0 8px;gap:6px;
  z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15);
}
.topbar .icon-btn{
  width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);
  border:none;color:inherit;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:transform .15s;
}
.topbar .icon-btn:active{transform:scale(.88)}
.topbar .icon-btn.active{background:var(--accent);color:#fff}
.topbar .title{
  flex:1;font-size:13px;font-weight:bold;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;text-align:center;
}
.progress-bar{position:fixed;top:56px;left:0;right:0;height:3px;background:rgba(255,255,255,.1);z-index:99}
.progress-fill{height:100%;background:var(--accent);width:0;transition:width .2s}
#app{padding:70px 16px 130px;max-width:700px;margin:0 auto}
#content{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#content h1{font-size:22px;color:var(--accent2);margin:20px 0 12px;padding-bottom:10px;border-bottom:3px solid var(--accent);text-align:center}
#content h2{font-size:19px;color:var(--accent2);margin:24px 0 10px;padding:10px 14px;background:var(--card2);border-right:4px solid var(--accent);border-radius:8px}
#content h3{font-size:17px;color:var(--primary);margin:18px 0 8px;padding-right:10px;border-right:3px solid var(--accent)}
#content h4{font-size:15px;color:var(--primary);margin:14px 0 6px}
#content p{margin:10px 0;text-align:justify;line-height:2}
#content ul,#content ol{margin:10px 20px 10px 0;padding-right:16px}
#content li{margin:6px 0;line-height:1.9}
#content strong{color:var(--accent2)}
#content em{color:var(--accent)}
.callout{background:var(--card);border-radius:12px;padding:14px 16px;margin:14px 0;box-shadow:var(--shadow);border-right:4px solid var(--accent)}
.callout.warn{border-right-color:#f39c12;background:linear-gradient(to left,rgba(243,156,18,.08),var(--card))}
.callout.danger{border-right-color:#e74c3c;background:linear-gradient(to left,rgba(231,76,60,.08),var(--card))}
.callout.tip{border-right-color:#3498db;background:linear-gradient(to left,rgba(52,152,219,.08),var(--card))}
.callout-title{font-weight:bold;color:var(--accent2);margin-bottom:8px;font-size:14px}
.callout.warn .callout-title{color:#d35400}
.callout.danger .callout-title{color:#c0392b}
.callout.tip .callout-title{color:#2980b9}
table{width:100%;border-collapse:collapse;margin:14px 0;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);font-size:13.5px}
th{background:var(--accent);color:#fff;padding:10px;text-align:right;font-size:12.5px}
td{padding:10px;border-bottom:1px solid var(--border);text-align:right}
tr:last-child td{border-bottom:none}
tr:nth-child(even) td{background:var(--card2)}
.nav-btns{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:8px 10px;display:flex;gap:6px;z-index:100;box-shadow:0 -4px 12px rgba(0,0,0,.08)}
.nav-btns button{flex:1;padding:11px 8px;border:none;border-radius:10px;background:var(--card2);color:var(--text);font-size:12.5px;font-family:inherit;font-weight:bold;cursor:pointer}
.nav-btns button:active{transform:scale(.96)}
.nav-btns button:disabled{opacity:.4;cursor:not-allowed}
.nav-btns .primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.audio-panel{position:fixed;bottom:56px;left:0;right:0;background:linear-gradient(135deg,var(--nav-bg),#0a2e24);color:#fff;padding:14px 14px 12px;transform:translateY(100%);transition:transform .3s ease;z-index:98;box-shadow:0 -4px 20px rgba(0,0,0,.2)}
.audio-panel.open{transform:translateY(0)}
.audio-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px}
.audio-title{font-weight:bold;color:var(--accent);display:flex;align-items:center;gap:6px}
.audio-close{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.audio-controls{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:10px}
.audio-btn{width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .2s}
.audio-btn:active{transform:scale(.9)}
.audio-btn.play{background:var(--accent);color:#fff;width:56px;height:56px;font-size:24px}
.audio-status{text-align:center;font-size:11.5px;color:rgba(255,255,255,.75);margin-bottom:8px;height:16px;overflow:hidden}
.audio-progress{height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;margin-bottom:10px}
.audio-progress-fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.speed-row{display:flex;gap:6px;justify-content:center;font-size:11px}
.speed-row button{padding:5px 10px;border-radius:12px;background:rgba(255,255,255,.12);border:none;color:#fff;cursor:pointer;font-family:inherit;font-size:11px}
.speed-row button.active{background:var(--accent);color:#fff;font-weight:bold}
.drawer{position:fixed;top:0;right:0;bottom:0;width:300px;max-width:85%;background:var(--card);z-index:200;transform:translateX(100%);transition:transform .3s ease;overflow-y:auto;box-shadow:-10px 0 30px rgba(0,0,0,.3)}
.drawer.open{transform:translateX(0)}
.drawer-head{background:var(--nav-bg);color:var(--nav-text);padding:20px 16px;position:sticky;top:0;z-index:1}
.drawer-head h3{color:#fff;margin:0 0 6px;font-size:15px;border:none;padding:0}
.drawer-head p{font-size:11px;color:rgba(255,255,255,.7);margin:0}
.drawer-list{padding:10px 0}
.drawer-item{padding:12px 18px;font-size:13.5px;cursor:pointer;border-right:3px solid transparent;display:flex;align-items:center;gap:10px;color:var(--text)}
.drawer-item:active{background:var(--card2)}
.drawer-item.active{background:var(--card2);border-right-color:var(--accent);color:var(--accent2);font-weight:bold}
.drawer-item .num{width:26px;height:26px;border-radius:6px;background:var(--card2);color:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;flex-shrink:0}
.drawer-item.active .num{background:var(--accent);color:#fff}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199;opacity:0;pointer-events:none;transition:opacity .3s}
.backdrop.open{opacity:1;pointer-events:auto}
.search-overlay{position:fixed;inset:0;background:var(--bg);z-index:300;transform:translateY(-100%);transition:transform .3s ease;overflow-y:auto;padding:70px 16px 20px}
.search-overlay.open{transform:translateY(0)}
.search-box{flex:1;padding:13px 16px;border-radius:12px;background:var(--card);border:2px solid var(--accent);color:var(--text);font-family:inherit;font-size:14px}
.search-box:focus{outline:none}
.search-results{margin-top:16px}
.result-item{padding:14px;background:var(--card);border-radius:12px;margin:8px 0;cursor:pointer;box-shadow:var(--shadow)}
.result-item:active{transform:scale(.98)}
.result-title{font-size:13px;font-weight:bold;color:var(--accent2);margin-bottom:6px}
.result-snippet{font-size:12.5px;color:var(--muted);line-height:1.7}
mark{background:rgba(255,183,3,.5);color:inherit;padding:0 2px;border-radius:3px}
.cover{text-align:center;padding:20px}
.cover-icon{font-size:72px;margin-bottom:14px;display:block}
.cover-title{font-size:23px;font-weight:bold;color:var(--accent2);margin-bottom:8px;line-height:1.5}
.cover-sub{font-size:13px;color:var(--muted);margin-bottom:6px}
.cover-org{display:inline-block;margin-top:16px;padding:7px 14px;background:var(--card2);color:var(--accent2);border-radius:20px;font-size:12px;font-weight:bold;border:1px solid var(--accent)}
.cover-desc{margin:24px 0;padding:16px;background:var(--card);border-radius:12px;font-size:13px;color:var(--muted);line-height:1.9;text-align:right;border-right:4px solid var(--accent)}
.cover-btn{display:inline-block;width:100%;max-width:280px;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:bold;font-family:inherit;cursor:pointer;margin-top:8px;box-shadow:0 8px 24px rgba(46,204,113,.3)}
.cover-btn:active{transform:scale(.97)}
.cover-stats{display:flex;justify-content:center;gap:12px;margin:20px 0;flex-wrap:wrap}
.stat-box{background:var(--card);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);min-width:80px}
.stat-num{font-size:20px;font-weight:bold;color:var(--accent2)}
.stat-lbl{font-size:10.5px;color:var(--muted);margin-top:4px}
.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;line-height:2}
.spinner{width:40px;height:40px;border:4px solid var(--card2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--card2)}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn" onclick="openDrawer()" title="فهرست">☰</button>
  <div class="title" id="topTitle">ایمنی در آزمایشگاه‌های نفت</div>
  <button class="icon-btn" onclick="openSearch()" title="جستجو">🔍</button>
  <button class="icon-btn" onclick="toggleAudio()" id="audioBtn" title="صدا">🔊</button>
  <button class="icon-btn" onclick="toggleTheme()" title="حالت شب" id="themeBtn">🌙</button>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div id="app">
  <div id="content"></div>
</div>

<div class="audio-panel" id="audioPanel">
  <div class="audio-header">
    <div class="audio-title">🔊 خواندن صوتی</div>
    <button class="audio-close" onclick="toggleAudio()">✕</button>
  </div>
  <div class="audio-status" id="audioStatus">برای شروع، دکمهٔ پخش را بزنید</div>
  <div class="audio-progress"><div class="audio-progress-fill" id="audioProgress"></div></div>
  <div class="audio-controls">
    <button class="audio-btn" onclick="restartAudio()" title="از اول">⏮</button>
    <button class="audio-btn play" onclick="togglePlay()" id="playBtn">▶</button>
    <button class="audio-btn" onclick="stopAudio()" title="توقف">⏹</button>
  </div>
  <div class="speed-row">
    <button onclick="setSpeed(0.7)" data-speed="0.7">🐢 آهسته</button>
    <button onclick="setSpeed(1.0)" data-speed="1.0" class="active">▶ معمولی</button>
    <button onclick="setSpeed(1.3)" data-speed="1.3">🐇 سریع</button>
  </div>
</div>

<div class="nav-btns">
  <button id="prevBtn" onclick="goPrev()">← قبلی</button>
  <button class="primary" onclick="openDrawer()">📑 فهرست</button>
  <button id="nextBtn" onclick="goNext()">بعدی →</button>
</div>

<div class="backdrop" id="backdrop" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h3>📚 فهرست مطالب</h3>
    <p id="drawerSubtitle">ایمنی در آزمایشگاه‌های نفت</p>
  </div>
  <div class="drawer-list" id="drawerList"></div>
</div>

<div class="search-overlay" id="searchOverlay">
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
    <input type="text" class="search-box" id="searchInput" placeholder="جستجو در کتاب..." oninput="doSearch(this.value)">
    <button class="icon-btn" style="background:var(--card2);color:var(--text);width:44px;height:44px" onclick="closeSearch()">✕</button>
  </div>
  <div class="search-results" id="searchResults"></div>
</div>

<script src="chapters1.js"></script>
<script src="chapters2.js"></script>
<script src="chapters3.js"></script>
<script src="chapters4.js"></script>
<script src="chapters5.js"></script>
<script src="chapters6.js"></script>
<script src="chapters7.js"></script>
<script src="chapters8.js"></script>
<script src="chapters9.js"></script>
<script src="chapters10.js"></script>

<script>
'use strict';
var CHAPTERS = window.SAFETY_BOOK || [];
var currentIdx = -1;
var fontSizeLevels = [14, 16, 18, 20];
var currentFont = 1;
var STORAGE_KEY = 'safety_book_state_v3';

/* ===== تشخیص TTS ===== */
var hasAndroidTTS = false;
try {
  if (typeof AndroidTTS !== 'undefined' && AndroidTTS !== null) {
    if (typeof AndroidTTS.isAvailable === 'function') {
      hasAndroidTTS = AndroidTTS.isAvailable();
    } else {
      hasAndroidTTS = true;
    }
  }
} catch(e) {
  hasAndroidTTS = false;
}
var hasWebTTS = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
var ttsAvailable = hasAndroidTTS || hasWebTTS;

/* ===== حالت صوتی ===== */
var audio = {
  speaking: false,
  paused: false,
  speed: 1.0,
  utterance: null,
  chunks: [],
  currentChunk: 0,
  timer: null,
  useAndroid: hasAndroidTTS
};

function extractReadableText(html) {
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  var tables = tmp.querySelectorAll('table');
  for (var i = 0; i < tables.length; i++) {
    tables[i].parentNode.removeChild(tables[i]);
  }
  var text = tmp.textContent || tmp.innerText || '';
  text = text.replace(/\s+/g, ' ').trim();
  return text;
}

function splitIntoChunks(text, maxLen) {
  maxLen = maxLen || 200;
  var sentences = text.split(/(?<=[.!?؟।])\s+/);
  var chunks = [];
  var current = '';
  for (var i = 0; i < sentences.length; i++) {
    var s = sentences[i].trim();
    if (!s) continue;
    if ((current + ' ' + s).length > maxLen) {
      if (current) chunks.push(current.trim());
      if (s.length > maxLen) {
        var words = s.split(' ');
        var sub = '';
        for (var k = 0; k < words.length; k++) {
          if ((sub + ' ' + words[k]).length > maxLen) {
            if (sub) chunks.push(sub.trim());
            sub = words[k];
          } else {
            sub = sub ? sub + ' ' + words[k] : words[k];
          }
        }
        if (sub) current = sub;
      } else {
        current = s;
      }
    } else {
      current = current ? current + ' ' + s : s;
    }
  }
  if (current) chunks.push(current.trim());
  return chunks;
}

function speakChunk(text, onEnd) {
  if (audio.useAndroid) {
    try {
      AndroidTTS.speak(text);
    } catch(e) {}
    var charsPerSec = 15 * audio.speed;
    var estimatedMs = (text.length / charsPerSec) * 1000 + 500;
    audio.timer = setTimeout(function() {
      if (onEnd && audio.speaking && !audio.paused) onEnd();
    }, estimatedMs);
  } else if (hasWebTTS) {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'fa-IR';
    u.rate = audio.speed;
    u.pitch = 1.0;
    u.onend = function() {
      if (onEnd && audio.speaking && !audio.paused) onEnd();
    };
    u.onerror = function() {
      if (onEnd && audio.speaking && !audio.paused) onEnd();
    };
    audio.utterance = u;
    window.speechSynthesis.speak(u);
  }
}

function startAudio() {
  if (!ttsAvailable) {
    alert('خواندن صوتی پشتیبانی نمی‌شود. لطفاً Google Text-to-Speech را نصب کنید.');
    return;
  }
  if (currentIdx < 0 || currentIdx >= CHAPTERS.length) {
    alert('اول یک فصل را باز کن.');
    return;
  }
  var ch = CHAPTERS[currentIdx];
  var text = extractReadableText(ch.content);
  audio.chunks = splitIntoChunks(text, 200);
  audio.currentChunk = 0;
  audio.speaking = true;
  audio.paused = false;
  speakCurrent();
}

function speakCurrent() {
  if (!audio.speaking || audio.currentChunk >= audio.chunks.length) {
    finishAudio();
    return;
  }
  var chunk = audio.chunks[audio.currentChunk];
  setAudioStatus('در حال خواندن... (' + Math.round((audio.currentChunk / audio.chunks.length) * 100) + '٪)');
  updateAudioProgress();
  speakChunk(chunk, function() {
    if (!audio.speaking || audio.paused) return;
    audio.currentChunk++;
    speakCurrent();
  });
}

function togglePlay() {
  if (!ttsAvailable) {
    alert('خواندن صوتی پشتیبانی نمی‌شود.');
    return;
  }
  if (audio.chunks.length === 0) {
    startAudio();
    return;
  }
  if (audio.speaking && !audio.paused) {
    audio.paused = true;
    if (audio.useAndroid) {
      try { AndroidTTS.stop(); } catch(e) {}
      if (audio.timer) clearTimeout(audio.timer);
    } else if (hasWebTTS) {
      window.speechSynthesis.pause();
    }
    setAudioStatus('⏸ متوقف');
    document.getElementById('playBtn').textContent = '▶';
  } else if (audio.paused) {
    audio.paused = false;
    audio.speaking = true;
    document.getElementById('playBtn').textContent = '⏸';
    speakCurrent();
  } else {
    startAudio();
  }
}

function stopAudio() {
  audio.speaking = false;
  audio.paused = false;
  audio.chunks = [];
  audio.currentChunk = 0;
  if (audio.timer) clearTimeout(audio.timer);
  if (audio.useAndroid) {
    try { AndroidTTS.stop(); } catch(e) {}
  } else if (hasWebTTS) {
    window.speechSynthesis.cancel();
  }
  setAudioStatus('برای شروع، دکمهٔ پخش را بزنید');
  document.getElementById('playBtn').textContent = '▶';
  document.getElementById('audioProgress').style.width = '0%';
}

function restartAudio() {
  stopAudio();
  setTimeout(startAudio, 200);
}

function finishAudio() {
  audio.speaking = false;
  audio.paused = false;
  document.getElementById('playBtn').textContent = '▶';
  setAudioStatus('✅ پایان فصل');
}

function setSpeed(s) {
  audio.speed = s;
  var btns = document.querySelectorAll('.speed-row button');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.remove('active');
    if (parseFloat(btns[i].getAttribute('data-speed')) === s) {
      btns[i].classList.add('active');
    }
  }
  if (audio.useAndroid) {
    try { AndroidTTS.setRate(s); } catch(e) {}
  }
  if (audio.speaking && !audio.paused) {
    var wasChunk = audio.currentChunk;
    if (audio.useAndroid) {
      try { AndroidTTS.stop(); } catch(e) {}
    } else if (hasWebTTS) {
      window.speechSynthesis.cancel();
    }
    if (audio.timer) clearTimeout(audio.timer);
    audio.currentChunk = wasChunk;
    setTimeout(speakCurrent, 200);
  }
}

function toggleAudio() {
  var panel = document.getElementById('audioPanel');
  var btn = document.getElementById('audioBtn');
  var open = panel.classList.toggle('open');
  btn.classList.toggle('active', open);
  if (!open) {
    stopAudio();
  }
}

function updateAudioProgress() {
  if (audio.chunks.length === 0) return;
  var pct = (audio.currentChunk / audio.chunks.length) * 100;
  document.getElementById('audioProgress').style.width = pct + '%';
}

function setAudioStatus(msg) {
  var el = document.getElementById('audioStatus');
  if (el) el.textContent = msg;
}

function loadState() {
  try {
    var s = localStorage.getItem(STORAGE_KEY);
    if (s) return JSON.parse(s);
  } catch(e) {}
  return { idx: -1, theme: 'light', font: 1, speed: 1.0 };
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      idx: currentIdx,
      theme: document.documentElement.classList.contains('dark') ? 'dark' : 'light',
      font: currentFont,
      speed: audio.speed
    }));
  } catch(e) {}
}

function renderCover() {
  stopAudio();
  currentIdx = -1;
  document.getElementById('topTitle').textContent = 'معرفی کتاب';
  document.getElementById('content').innerHTML =
    '<div class="cover">' +
      '<span class="cover-icon">🦺</span>' +
      '<div class="cover-title">ایمنی در آزمایشگاه‌های نفت</div>' +
      '<div class="cover-sub">دستورالعمل‌های کاربردی در مراکز تحقیقاتی و آزمایشگاهی</div>' +
      '<div class="cover-org">🎓 دانشکده نفت اهواز — واحد HSE</div>' +
      '<div class="cover-stats">' +
        '<div class="stat-box"><div class="stat-num">' + CHAPTERS.length + '</div><div class="stat-lbl">فصل</div></div>' +
        '<div class="stat-box"><div class="stat-num">۹۰+</div><div class="stat-lbl">مادهٔ شیمیایی</div></div>' +
        '<div class="stat-box"><div class="stat-num">۱۰۰+</div><div class="stat-lbl">دستگاه</div></div>' +
      '</div>' +
      '<div class="cover-desc">' +
        '<strong>📖 دربارهٔ این کتاب:</strong><br>' +
        'این کتاب راهنمای جامع ایمنی برای دانشجویان، پژوهشگران و کارکنان آزمایشگاه‌های تحقیقاتی صنعت نفت است. ' +
        'شامل اصول فرهنگ ایمنی، مدیریت ریسک، دستورالعمل‌های عملی کار با تجهیزات، ' +
        'ایمنی مواد شیمیایی پرکاربرد، و نکات حیاتی کار با کپسول‌های گاز تحت فشار.' +
      '</div>' +
      '<button class="cover-btn" onclick="goToChapter(0)">📖 شروع مطالعه</button>' +
      '<div style="margin-top:26px;font-size:11px;color:var(--muted);line-height:1.9">' +
        'تهیه‌شده برای: دانشجویان و پژوهشگران دانشگاهی<br>' +
        'تمامی حقوق مادی و معنوی متعلق به دانشکده نفت اهواز می‌باشد.' +
      '</div>' +
    '</div>';
  document.getElementById('prevBtn').disabled = true;
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('progressFill').style.width = '0%';
  updateDrawer();
  saveState();
}

function renderChapter(idx) {
  stopAudio();
  if (idx < 0) { renderCover(); return; }
  if (idx >= CHAPTERS.length) idx = CHAPTERS.length - 1;
  currentIdx = idx;
  var ch = CHAPTERS[idx];
  document.getElementById('topTitle').textContent = ch.title;
  var html = '<h1>' + ch.title + '</h1>';
  if (ch.subtitle) {
    html += '<p style="text-align:center;color:var(--muted);margin-top:-10px;margin-bottom:20px;font-size:12.5px">' + ch.subtitle + '</p>';
  }
  html += ch.content;
  document.getElementById('content').innerHTML = html;
  document.getElementById('prevBtn').disabled = false;
  document.getElementById('nextBtn').disabled = (idx >= CHAPTERS.length - 1);
  var pct = ((idx + 1) / CHAPTERS.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  updateDrawer();
  window.scrollTo(0, 0);
  saveState();
}

function goToChapter(idx) { renderChapter(idx); closeDrawer(); closeSearch(); }
function goNext() {
  if (currentIdx === -1) renderChapter(0);
  else if (currentIdx < CHAPTERS.length - 1) renderChapter(currentIdx + 1);
}
function goPrev() {
  if (currentIdx === 0) renderCover();
  else if (currentIdx > 0) renderChapter(currentIdx - 1);
}

function buildDrawerList() {
  var html = '<div class="drawer-item" onclick="goToChapter(-1)" data-idx="-1">' +
    '<span class="num">🏠</span> معرفی کتاب</div>';
  for (var i = 0; i < CHAPTERS.length; i++) {
    html += '<div class="drawer-item" onclick="goToChapter(' + i + ')" data-idx="' + i + '">' +
      '<span class="num">' + (i + 1) + '</span> ' + CHAPTERS[i].title + '</div>';
  }
  document.getElementById('drawerList').innerHTML = html;
}
function updateDrawer() {
  var items = document.querySelectorAll('.drawer-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.remove('active');
    if (parseInt(items[i].getAttribute('data-idx')) === currentIdx) {
      items[i].classList.add('active');
    }
  }
}
function openDrawer() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('backdrop').classList.add('open');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
}

function openSearch() {
  document.getElementById('searchOverlay').classList.add('open');
  setTimeout(function(){ document.getElementById('searchInput').focus(); }, 300);
}
function closeSearch() {
  document.getElementById('searchOverlay').classList.remove('open');
  document.getElementById('searchResults').innerHTML = '';
  document.getElementById('searchInput').value = '';
}
function stripHtml(html) {
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}
function doSearch(query) {
  var results = document.getElementById('searchResults');
  query = (query || '').trim();
  if (query.length < 2) { results.innerHTML = ''; return; }
  var found = [];
  var q = query.toLowerCase();
  for (var i = 0; i < CHAPTERS.length; i++) {
    var text = stripHtml(CHAPTERS[i].content);
    var t = text.toLowerCase();
    var pos = t.indexOf(q);
    if (pos >= 0) {
      var start = Math.max(0, pos - 60);
      var end = Math.min(text.length, pos + 100);
      var snippet = text.substring(start, end);
      var before = snippet.substring(0, pos - start);
      var match = snippet.substring(pos - start, pos - start + query.length);
      var after = snippet.substring(pos - start + query.length);
      found.push({
        idx: i,
        title: CHAPTERS[i].title,
        snippet: '...' + escapeHtml(before) + '<mark>' + escapeHtml(match) + '</mark>' + escapeHtml(after) + '...'
      });
    }
  }
  if (found.length === 0) {
    results.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px">نتیجه‌ای یافت نشد.</div>';
    return;
  }
  var html = '<div style="font-size:12px;color:var(--muted);margin-bottom:10px">' + found.length + ' نتیجه یافت شد</div>';
  for (var j = 0; j < found.length; j++) {
    html += '<div class="result-item" onclick="goToChapter(' + found[j].idx + ')">' +
      '<div class="result-title">' + escapeHtml(found[j].title) + '</div>' +
      '<div class="result-snippet">' + found[j].snippet + '</div></div>';
  }
  results.innerHTML = html;
}
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleTheme() {
  var isDark = document.documentElement.classList.toggle('dark');
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
  saveState();
}

(function init() {
  var s = loadState();
  if (s.theme === 'dark') {
    document.documentElement.classList.add('dark');
    setTimeout(function(){ document.getElementById('themeBtn').textContent = '☀️'; }, 0);
  }
  if (s.font !== undefined && s.font !== 1) {
    currentFont = s.font;
    document.documentElement.style.setProperty('--font-size', fontSizeLevels[currentFont] + 'px');
  }
  if (s.speed) audio.speed = s.speed;
  if (!ttsAvailable) {
    var btn = document.getElementById('audioBtn');
    if (btn) {
      btn.style.opacity = '0.4';
      btn.title = 'صدا پشتیبانی نمی‌شود';
    }
  }
  buildDrawerList();
  if (CHAPTERS.length === 0) {
    document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div>در حال بارگذاری محتوا...</div>';
  } else if (s.idx >= 0 && s.idx < CHAPTERS.length) {
    renderChapter(s.idx);
  } else {
    renderCover();
  }
  window.addEventListener('beforeunload', function() {
    if (audio.timer) clearTimeout(audio.timer);
    if (audio.useAndroid) {
      try { AndroidTTS.stop(); } catch(e) {}
    } else if (hasWebTTS) {
      window.speechSynthesis.cancel();
    }
    saveState();
  });
})();
</script>
</body>
</html>
