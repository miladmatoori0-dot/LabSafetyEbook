<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f0f9f4">
<title>put book HSE</title>
<style>
:root{
  --bg:#f5faf7;--card:#ffffff;--card2:#e8f5ee;
  --primary:#0d3b2e;--accent:#2ecc71;--accent2:#16a34a;
  --text:#1a202c;--muted:#64748b;--border:#d1e7dd;
  --shadow:0 4px 20px rgba(13,59,46,.08);
  --nav-bg:#0d3b2e;--nav-text:#e8f5ee;
  --font-size:16px;
}
html.dark{
  --bg:#0a1f17;--card:#132b22;--card2:#1c3a2e;
  --primary:#e8f5ee;--accent:#2ecc71;--accent2:#16a34a;
  --text:#e0e1dd;--muted:#8d99ae;--border:#2a4a3d;
  --shadow:0 4px 20px rgba(0,0,0,.4);
  --nav-bg:#061410;--nav-text:#e8f5ee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:var(--font-size);line-height:1.9;transition:background .3s,color .3s;min-height:100vh;overflow-x:hidden}
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:var(--nav-bg);color:var(--nav-text);display:flex;align-items:center;padding:0 8px;gap:6px;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.topbar .icon-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:inherit;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s}
.topbar .icon-btn:active{transform:scale(.88)}
.topbar .title{flex:1;font-size:13px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.progress-bar{position:fixed;top:56px;left:0;right:0;height:3px;background:rgba(255,255,255,.1);z-index:99}
.progress-fill{height:100%;background:var(--accent);width:0;transition:width .2s}
#app{padding:70px 16px 130px;max-width:700px;margin:0 auto}

/* === انیمیشن‌های پس‌زمینه === */
.bg-particles {
  position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
}
.particle {
  position: absolute; background: var(--accent); border-radius: 50%; opacity: 0.15;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  20% { opacity: 0.2; }
  80% { opacity: 0.2; }
  100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
}

#content{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#content h1{font-size:22px;color:var(--accent2);margin:20px 0 12px;padding-bottom:10px;border-bottom:3px solid var(--accent);text-align:center}
#content h2{font-size:19px;color:var(--accent2);margin:24px 0 10px;padding:10px 14px;background:var(--card2);border-right:4px solid var(--accent);border-radius:8px}
#content h3{font-size:17px;color:var(--primary);margin:18px 0 8px;padding-right:10px;border-right:3px solid var(--accent)}
#content h4{font-size:15px;color:var(--primary);margin:14px 0 6px}
#content p{margin:10px 0;text-align:justify;line-height:2}
#content ul,#content ol{margin:10px 20px 10px 0;padding-right:16px}
#content li{margin:6px 0;line-height:1.9}
#content strong{color:var(--accent2)}
#content em{color:var(--accent)}
.callout{background:var(--card);border-radius:12px;padding:14px 16px;margin:14px 0;box-shadow:var(--shadow);border-right:4px solid var(--accent)}
.callout.warn{border-right-color:#f39c12;background:linear-gradient(to left,rgba(243,156,18,.08),var(--card))}
.callout.danger{border-right-color:#e74c3c;background:linear-gradient(to left,rgba(231,76,60,.08),var(--card))}
.callout.tip{border-right-color:#3498db;background:linear-gradient(to left,rgba(52,152,219,.08),var(--card))}
.callout-title{font-weight:bold;color:var(--accent2);margin-bottom:8px;font-size:14px}
.callout.warn .callout-title{color:#d35400}
.callout.danger .callout-title{color:#c0392b}
.callout.tip .callout-title{color:#2980b9}
table{width:100%;border-collapse:collapse;margin:14px 0;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);font-size:13.5px}
th{background:var(--accent);color:#fff;padding:10px;text-align:right;font-size:12.5px}
td{padding:10px;border-bottom:1px solid var(--border);text-align:right}
tr:last-child td{border-bottom:none}
tr:nth-child(even) td{background:var(--card2)}
.nav-btns{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:8px 10px;display:flex;gap:6px;z-index:100;box-shadow:0 -4px 12px rgba(0,0,0,.08)}
.nav-btns button{flex:1;padding:11px 8px;border:none;border-radius:10px;background:var(--card2);color:var(--text);font-size:12.5px;font-family:inherit;font-weight:bold;cursor:pointer}
.nav-btns button:active{transform:scale(.96)}
.nav-btns button:disabled{opacity:.4;cursor:not-allowed}
.nav-btns .primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}

/* === دکمه‌های شناور === */
.floating-btn {
  position: fixed; bottom: 80px; left: 20px; width: 48px; height: 48px;
  border-radius: 50%; background: var(--accent); color: #fff; border: none;
  box-shadow: 0 6px 20px rgba(46,204,113,0.4); cursor: pointer;
  display: none; align-items: center; justify-content: center; font-size: 20px;
  z-index: 95; transition: transform 0.2s;
}
.floating-btn:active { transform: scale(0.9); }
.floating-btn.show { display: flex; }
.bookmark-btn {
  position: fixed; bottom: 80px; right: 20px; width: 48px; height: 48px;
  border-radius: 50%; background: #f39c12; color: #fff; border: none;
  box-shadow: 0 6px 20px rgba(243,156,18,0.4); cursor: pointer;
  display: none; align-items: center; justify-content: center; font-size: 20px;
  z-index: 95; transition: transform 0.2s;
}
.bookmark-btn:active { transform: scale(0.9); }
.bookmark-btn.show { display: flex; }
.bookmark-btn.saved { background: var(--green); box-shadow: 0 6px 20px rgba(46,204,113,0.4); }

/* === منوی کشویی === */
.drawer{position:fixed;top:0;right:0;bottom:0;width:300px;max-width:85%;background:var(--card);z-index:200;transform:translateX(100%);transition:transform .3s ease;overflow-y:auto;box-shadow:-10px 0 30px rgba(0,0,0,.3)}
.drawer.open{transform:translateX(0)}
.drawer-head{background:var(--nav-bg);color:var(--nav-text);padding:20px 16px;position:sticky;top:0;z-index:1}
.drawer-head h3{color:#fff;margin:0 0 6px;font-size:15px;border:none;padding:0}
.drawer-head p{font-size:11px;color:rgba(255,255,255,.7);margin:0}
.drawer-list{padding:10px 0}
.drawer-item{padding:12px 18px;font-size:13.5px;cursor:pointer;border-right:3px solid transparent;display:flex;align-items:center;gap:10px;color:var(--text)}
.drawer-item:active{background:var(--card2)}
.drawer-item.active{background:var(--card2);border-right-color:var(--accent);color:var(--accent2);font-weight:bold}
.drawer-item .num{width:26px;height:26px;border-radius:6px;background:var(--card2);color:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;flex-shrink:0}
.drawer-item.active .num{background:var(--accent);color:#fff}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199;opacity:0;pointer-events:none;transition:opacity .3s}
.backdrop.open{opacity:1;pointer-events:auto}

/* === جستجو === */
.search-overlay{position:fixed;inset:0;background:var(--bg);z-index:300;transform:translateY(-100%);transition:transform .3s ease;overflow-y:auto;padding:70px 16px 20px}
.search-overlay.open{transform:translateY(0)}
.search-box{flex:1;padding:13px 16px;border-radius:12px;background:var(--card);border:2px solid var(--accent);color:var(--text);font-family:inherit;font-size:14px}
.search-box:focus{outline:none}
.search-results{margin-top:16px}
.result-item{padding:14px;background:var(--card);border-radius:12px;margin:8px 0;cursor:pointer;box-shadow:var(--shadow)}
.result-item:active{transform:scale(.98)}
.result-title{font-size:13px;font-weight:bold;color:var(--accent2);margin-bottom:6px}
.result-snippet{font-size:12.5px;color:var(--muted);line-height:1.7}
mark{background:rgba(255,183,3,.5);color:inherit;padding:0 2px;border-radius:3px}

/* === صفحهٔ اول === */
.cover{text-align:center;padding:20px}
.animated-cover { position: relative; overflow: hidden; padding-top: 20px; }

/* آیکون‌های شناور */
.icon-cluster {
  position: relative; height: 180px; margin: 0 auto 10px; width: 100%;
}
.float-icon {
  position: absolute; font-size: 40px; opacity: 0.9;
  filter: drop-shadow(0 8px 16px rgba(46,204,113,0.3));
}
.fi-1 { top: 20px; left: 15%; animation: floatAnim 3s ease-in-out infinite; }
.fi-2 { top: 60px; right: 15%; animation: floatAnim 4s ease-in-out infinite 0.5s; }
.fi-3 { top: 100px; left: 25%; animation: floatAnim 3.5s ease-in-out infinite 1s; }
.fi-4 { top: 10px; right: 30%; animation: floatAnim 4.5s ease-in-out infinite 0.8s; }
.fi-5 { top: 130px; right: 25%; animation: floatAnim 3.2s ease-in-out infinite 1.2s; }
.fi-6 { top: 40px; left: 40%; animation: floatAnim 3.8s ease-in-out infinite 0.3s; }

@keyframes floatAnim {
  0% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-15px) rotate(5deg); }
  100% { transform: translateY(0) rotate(0deg); }
}

/* هاله پالس */
.pulse-ring {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 120px; height: 120px; border-radius: 50%;
  border: 2px solid var(--accent); opacity: 0;
  animation: pulseRing 2.5s ease-out infinite;
}
@keyframes pulseRing {
  0% { width: 100px; height: 100px; opacity: 0.6; }
  100% { width: 250px; height: 250px; opacity: 0; }
}

.cover-title{font-size:23px;font-weight:bold;color:var(--accent2);margin-bottom:8px;line-height:1.5; animation: slideUp 0.8s ease-out both;}
.cover-sub{font-size:13px;color:var(--muted);margin-bottom:6px; animation: slideUp 1s ease-out 0.2s both;}
.cover-org{display:inline-block;margin-top:16px;padding:7px 14px;background:var(--card2);color:var(--accent2);border-radius:20px;font-size:12px;font-weight:bold;border:1px solid var(--accent); animation: slideUp 1.1s ease-out 0.4s both;}

@keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

.cover-stats{display:flex;justify-content:center;gap:12px;margin:20px 0;flex-wrap:wrap; animation: slideUp 1.2s ease-out 0.6s both;}
.stat-box{background:var(--card);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);min-width:80px; transition: transform 0.2s;}
.stat-box:hover { transform: translateY(-3px); }
.stat-num{font-size:20px;font-weight:bold;color:var(--accent2)}
.stat-lbl{font-size:10.5px;color:var(--muted);margin-top:4px}
.cover-desc{margin:24px 0;padding:16px;background:var(--card);border-radius:12px;font-size:13px;color:var(--muted);line-height:1.9;text-align:right;border-right:4px solid var(--accent); animation: slideUp 1.3s ease-out 0.8s both;}
.cover-btn{display:inline-block;width:100%;max-width:280px;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:bold;font-family:inherit;cursor:pointer;margin-top:8px;box-shadow:0 8px 24px rgba(46,204,113,.3); animation: slideUp 1.4s ease-out 1s both; transition: transform 0.2s;}
.cover-btn:active{transform:scale(.97)}
.cover-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(46,204,113,0.4); }

/* === نام گردآورنده (پایین کتاب) === */
.author-footer {
  margin-top: 40px; padding: 25px 20px;
  background: linear-gradient(135deg, var(--card), var(--card2));
  border-radius: 16px; border: 2px solid var(--accent);
  text-align: center; box-shadow: var(--shadow);
}
.author-footer .label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 8px; letter-spacing: 1px; }
.author-footer .name { font-size: 18px; font-weight: bold; color: var(--accent2); margin-bottom: 6px; }
.author-footer .role { font-size: 13px; color: var(--text); line-height: 1.6; }
.author-footer .org { margin-top: 16px; font-size: 11.5px; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 12px; }

.reading-time { font-size: 11.5px; color: var(--muted); text-align: left; margin-bottom: 16px; display: flex; align-items: center; gap: 5px; }
.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;line-height:2}
.spinner{width:40px;height:40px;border:4px solid var(--card2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--card2)}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
</style>
</head>
<body>

<!-- ذرات پس‌زمینه -->
<div class="bg-particles" id="bgParticles"></div>

<div class="topbar">
  <button class="icon-btn" onclick="openDrawer()" title="فهرست">☰</button>
  <div class="title" id="topTitle">put book HSE</div>
  <button class="icon-btn" onclick="openSearch()" title="جستجو">🔍</button>
  <button class="icon-btn" onclick="toggleTheme()" title="حالت شب" id="themeBtn">🌙</button>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div id="app">
  <div id="content"></div>
</div>

<!-- دکمه‌های شناور -->
<button class="floating-btn" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="بازگشت به بالا">⬆️</button>
<button class="bookmark-btn" id="bookmarkBtn" onclick="toggleBookmark()" title="نشانک‌گذاری">⭐</button>

<div class="nav-btns">
  <button id="prevBtn" onclick="goPrev()">← قبلی</button>
  <button class="primary" onclick="openDrawer()">📑 فهرست</button>
  <button id="nextBtn" onclick="goNext()">بعدی →</button>
</div>

<div class="backdrop" id="backdrop" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h3>📚 فهرست مطالب</h3>
    <p id="drawerSubtitle">put book HSE</p>
  </div>
  <div class="drawer-list" id="drawerList"></div>
</div>

<div class="search-overlay" id="searchOverlay">
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
    <input type="text" class="search-box" id="searchInput" placeholder="جستجو در کتاب..." oninput="doSearch(this.value)">
    <button class="icon-btn" style="background:var(--card2);color:var(--text);width:44px;height:44px" onclick="closeSearch()">✕</button>
  </div>
  <div class="search-results" id="searchResults"></div>
</div>

<script src="chapters1.js"></script>
<script src="chapters2.js"></script>
<script src="chapters3.js"></script>
<script src="chapters4.js"></script>
<script src="chapters5.js"></script>
<script src="chapters6.js"></script>
<script src="chapters7.js"></script>
<script src="chapters8.js"></script>
<script src="chapters9.js"></script>
<script src="chapters10.js"></script>

<script>
'use strict';
var CHAPTERS = window.SAFETY_BOOK || [];
var currentIdx = -1;
var fontSizeLevels = [14, 16, 18, 20];
var currentFont = 1;
var STORAGE_KEY = 'safety_book_state_v10';

// نشانک‌ها
var bookmarks = [];
try { var bm = localStorage.getItem('hse_bookmarks'); if (bm) bookmarks = JSON.parse(bm); } catch(e) {}

// === ذرات پس‌زمینه ===
function createParticles() {
  var container = document.getElementById('bgParticles');
  for (var i = 0; i < 20; i++) {
    var p = document.createElement('div');
    p.className = 'particle';
    var size = Math.random() * 8 + 4;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (Math.random() * 10 + 10) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    container.appendChild(p);
  }
}

// === مدیریت صفحه‌ها ===
function renderCover() {
  currentIdx = -1;
  document.getElementById('topTitle').textContent = 'put book HSE';
  document.getElementById('bookmarkBtn').classList.remove('show');
  document.getElementById('content').innerHTML =
    '<div class="cover animated-cover">' +
      '<div class="icon-cluster">' +
        '<div class="pulse-ring"></div>' +
        '<div class="float-icon fi-1">⛑️</div>' +
        '<div class="float-icon fi-2">⚙️</div>' +
        '<div class="float-icon fi-3">🧪</div>' +
        '<div class="float-icon fi-4">🛡️</div>' +
        '<div class="float-icon fi-5">🔥</div>' +
        '<div class="float-icon fi-6">⚠️</div>' +
      '</div>' +
      '<div class="cover-title">ایمنی در آزمایشگاه‌های نفت</div>' +
      '<div class="cover-sub">دستورالعمل‌های کاربردی در مراکز تحقیقاتی و آزمایشگاهی</div>' +
      '<div class="cover-org">🎓 دانشکده نفت اهواز — واحد HSE</div>' +
      
      '<div class="cover-stats">' +
        '<div class="stat-box"><div class="stat-num">' + CHAPTERS.length + '</div><div class="stat-lbl">فصل</div></div>' +
        '<div class="stat-box"><div class="stat-num">۹۰+</div><div class="stat-lbl">مادهٔ شیمیایی</div></div>' +
        '<div class="stat-box"><div class="stat-num">۱۰۰+</div><div class="stat-lbl">دستگاه</div></div>' +
      '</div>' +
      '<div class="cover-desc">' +
        '<strong>📖 دربارهٔ این کتاب:</strong><br>' +
        'این کتاب راهنمای جامع ایمنی برای دانشجویان، پژوهشگران و کارکنان آزمایشگاه‌های تحقیقاتی صنعت نفت است. ' +
        'شامل اصول فرهنگ ایمنی، مدیریت ریسک، دستورالعمل‌های عملی کار با تجهیزات، ' +
        'ایمنی مواد شیمیایی پرکاربرد، و نکات حیاتی کار با کپسول‌های گاز تحت فشار.' +
      '</div>' +
      '<button class="cover-btn" onclick="goToChapter(0)">📖 شروع مطالعه</button>' +
      '<div style="margin-top:26px;font-size:11px;color:var(--muted);line-height:1.9">' +
        'تهیه‌شده برای: دانشجویان و پژوهشگران دانشگاهی<br>' +
        'تمامی حقوق مادی و معنوی متعلق به دانشکده نفت اهواز می‌باشد.' +
      '</div>' +
    '</div>';
  document.getElementById('prevBtn').disabled = true;
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('progressFill').style.width = '0%';
  updateDrawer();
  saveState();
}

function renderChapter(idx) {
  if (idx < 0) { renderCover(); return; }
  if (idx >= CHAPTERS.length) idx = CHAPTERS.length - 1;
  currentIdx = idx;
  var ch = CHAPTERS[idx];
  document.getElementById('topTitle').textContent = ch.title;
  
  // محاسبه زمان مطالعه (حدود ۲۰۰ کلمه در دقیقه)
  var wordCount = ch.content.replace(/<[^>]*>/g, '').split(/\s+/).length;
  var readTime = Math.ceil(wordCount / 200);
  
  var html = '<h1>' + ch.title + '</h1>';
  if (ch.subtitle) html += '<p style="text-align:center;color:var(--muted);margin-top:-10px;margin-bottom:20px;font-size:12.5px">' + ch.subtitle + '</p>';
  
  html += '<div class="reading-time">⏱️ حدود ' + readTime + ' دقیقه مطالعه</div>';
  
  html += ch.content;
  
  if (idx === CHAPTERS.length - 1) {
    html += '<div class="author-footer">' +
              '<span class="label">گردآورنده</span>' +
              '<div class="name">محمد امین مطوری</div>' +
              '<div class="role">کارشناس ایمنی و بهداشت و محیط زیست</div>' +
              '<div class="org">دانشکده نفت اهواز — واحد HSE</div>' +
            '</div>';
  }
  
  document.getElementById('content').innerHTML = html;
  document.getElementById('prevBtn').disabled = false;
  document.getElementById('nextBtn').disabled = (idx >= CHAPTERS.length - 1);
  document.getElementById('progressFill').style.width = ((idx + 1) / CHAPTERS.length * 100) + '%';
  
  // بررسی نشانک
  updateBookmarkUI();
  document.getElementById('bookmarkBtn').classList.add('show');
  
  updateDrawer();
  window.scrollTo(0, 0);
  saveState();
}

function updateBookmarkUI() {
  var btn = document.getElementById('bookmarkBtn');
  if (bookmarks.includes(currentIdx)) {
    btn.classList.add('saved');
    btn.textContent = '⭐';
  } else {
    btn.classList.remove('saved');
    btn.textContent = '☆';
  }
}

function toggleBookmark() {
  if (currentIdx < 0) return;
  var i = bookmarks.indexOf(currentIdx);
  if (i >= 0) {
    bookmarks.splice(i, 1);
  } else {
    bookmarks.push(currentIdx);
  }
  try { localStorage.setItem('hse_bookmarks', JSON.stringify(bookmarks)); } catch(e) {}
  updateBookmarkUI();
  updateDrawer();
}

function goToChapter(idx) { renderChapter(idx); closeDrawer(); closeSearch(); }
function goNext() { if (currentIdx === -1) renderChapter(0); else if (currentIdx < CHAPTERS.length - 1) renderChapter(currentIdx + 1); }
function goPrev() { if (currentIdx === 0) renderCover(); else if (currentIdx > 0) renderChapter(currentIdx - 1); }

function buildDrawerList() {
  var html = '<div class="drawer-item" onclick="goToChapter(-1)" data-idx="-1"><span class="num">🏠</span> معرفی کتاب</div>';
  for (var i = 0; i < CHAPTERS.length; i++) {
    var star = bookmarks.includes(i) ? ' ⭐' : '';
    html += '<div class="drawer-item" onclick="goToChapter(' + i + ')" data-idx="' + i + '"><span class="num">' + (i + 1) + '</span> ' + CHAPTERS[i].title + star + '</div>';
  }
  document.getElementById('drawerList').innerHTML = html;
}

function updateDrawer() {
  buildDrawerList(); // بازسازی منو برای نمایش ستاره‌ها
  var items = document.querySelectorAll('.drawer-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.remove('active');
    if (parseInt(items[i].getAttribute('data-idx')) === currentIdx) items[i].classList.add('active');
  }
}

function openDrawer() { document.getElementById('drawer').classList.add('open'); document.getElementById('backdrop').classList.add('open'); }
function closeDrawer() { document.getElementById('drawer').classList.remove('open'); document.getElementById('backdrop').classList.remove('open'); }

function openSearch() { document.getElementById('searchOverlay').classList.add('open'); setTimeout(function(){ document.getElementById('searchInput').focus(); }, 300); }
function closeSearch() { document.getElementById('searchOverlay').classList.remove('open'); document.getElementById('searchResults').innerHTML = ''; document.getElementById('searchInput').value = ''; }
function stripHtml(html) { var tmp = document.createElement('div'); tmp.innerHTML = html; return tmp.textContent || tmp.innerText || ''; }
function doSearch(query) {
  var results = document.getElementById('searchResults');
  query = (query || '').trim();
  if (query.length < 2) { results.innerHTML = ''; return; }
  var found = []; var q = query.toLowerCase();
  for (var i = 0; i < CHAPTERS.length; i++) {
    var text = stripHtml(CHAPTERS[i].content); var t = text.toLowerCase(); var pos = t.indexOf(q);
    if (pos >= 0) {
      var start = Math.max(0, pos - 60), end = Math.min(text.length, pos + 100);
      var snippet = text.substring(start, end);
      var before = snippet.substring(0, pos - start);
      var match = snippet.substring(pos - start, pos - start + query.length);
      var after = snippet.substring(pos - start + query.length);
      found.push({ idx: i, title: CHAPTERS[i].title, snippet: '...' + escapeHtml(before) + '<mark>' + escapeHtml(match) + '</mark>' + escapeHtml(after) + '...' });
    }
  }
  if (found.length === 0) { results.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px">نتیجه‌ای یافت نشد.</div>'; return; }
  var html = '<div style="font-size:12px;color:var(--muted);margin-bottom:10px">' + found.length + ' نتیجه یافت شد</div>';
  for (var j = 0; j < found.length; j++) html += '<div class="result-item" onclick="goToChapter(' + found[j].idx + ')"><div class="result-title">' + escapeHtml(found[j].title) + '</div><div class="result-snippet">' + found[j].snippet + '</div></div>';
  results.innerHTML = html;
}
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toggleTheme() { var isDark = document.documentElement.classList.toggle('dark'); document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙'; saveState(); }

// === مدیریت اسکرول ===
window.addEventListener('scroll', function() {
  var btn = document.getElementById('backToTop');
  if (window.scrollY > 400) {
    btn.classList.add('show');
  } else {
    btn.classList.remove('show');
  }
});

// === ذخیره وضعیت ===
function loadState() {
  try { var s = localStorage.getItem(STORAGE_KEY); if (s) return JSON.parse(s); } catch(e) {}
  return { idx: -1, theme: 'light', font: 1 };
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ idx: currentIdx, theme: document.documentElement.classList.contains('dark') ? 'dark' : 'light', font: currentFont })); } catch(e) {}
}

(function init() {
  var s = loadState();
  if (s.theme === 'dark') { document.documentElement.classList.add('dark'); setTimeout(function(){ document.getElementById('themeBtn').textContent = '☀️'; }, 0); }
  if (s.font !== undefined && s.font !== 1) { currentFont = s.font; document.documentElement.style.setProperty('--font-size', fontSizeLevels[currentFont] + 'px'); }
  
  createParticles();
  buildDrawerList();
  
  if (CHAPTERS.length === 0) {
    document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div>در حال بارگذاری محتوا...</div>';
  } else if (s.idx >= 0 && s.idx < CHAPTERS.length) { renderChapter(s.idx); }
  else { renderCover(); }
  
  window.addEventListener('beforeunload', saveState);
})();
</script>
</body>
